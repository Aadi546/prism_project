<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>closed loop</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; font-family: "Segoe UI", Calibri, Arial, sans-serif; }
  .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
  .key { fill: #eef2ff; stroke: #1428a0; stroke-width: 2.5; }
  .bad { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
  .t { font-size: 22px; font-weight: 600; fill: #111827; }
  .s { font-size: 17px; fill: #4b5563; }
  .arrow { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#a); }
  .lbl { font-size: 16px; fill: #374151; }
</style>
</head>
<body>
<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  </defs>
  <rect class="box" x="40" y="40" width="250" height="100" rx="12"/>
  <text class="t" x="165" y="82" text-anchor="middle">Tap the fix</text>
  <text class="s" x="165" y="112" text-anchor="middle">actionableDeeplink</text>

  <rect class="box" x="610" y="40" width="250" height="100" rx="12"/>
  <text class="t" x="735" y="82" text-anchor="middle">Read it back</text>
  <text class="s" x="735" y="112" text-anchor="middle">validationDeeplink (val/)</text>

  <rect class="key" x="610" y="230" width="250" height="110" rx="12"/>
  <text class="t" x="735" y="272" text-anchor="middle">Compare</text>
  <text class="s" x="735" y="302" text-anchor="middle">Touch sensitivity</text>
  <text class="s" x="735" y="326" text-anchor="middle">equal "True"?</text>

  <rect class="box" x="40" y="230" width="250" height="110" rx="12"/>
  <text class="t" x="165" y="272" text-anchor="middle">Next safe step</text>
  <text class="s" x="165" y="302" text-anchor="middle">marked Verified</text>

  <rect class="bad" x="325" y="420" width="250" height="110" rx="12"/>
  <text class="t" x="450" y="462" text-anchor="middle">Unlock last resort</text>
  <text class="s" x="450" y="492" text-anchor="middle">restart / safe mode / reset</text>
  <text class="s" x="450" y="514" text-anchor="middle">(backup first)</text>

  <path class="arrow" d="M 290 90 L 606 90"/>
  <path class="arrow" d="M 735 140 L 735 226"/>
  <path class="arrow" d="M 610 285 L 294 285"/>
  <text class="lbl" x="452" y="273" text-anchor="middle">pass</text>
  <path class="arrow" d="M 165 230 L 165 144"/>
  <path class="arrow" d="M 165 340 C 165 420, 250 470, 322 474"/>
  <text class="lbl" x="150" y="410" text-anchor="middle">all verified,</text>
  <text class="lbl" x="150" y="430" text-anchor="middle">still broken</text>
  <path class="arrow" d="M 735 340 C 735 420, 650 470, 578 474"/>
  <text class="lbl" x="760" y="420" text-anchor="middle">fail: flag it</text>
</svg>
</body>
</html>
