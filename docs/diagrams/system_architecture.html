<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>system architecture</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; font-family: "Segoe UI", Calibri, Arial, sans-serif; }
  .layer { fill: #f8fafc; stroke: #e5e7eb; stroke-width: 1.5; }
  .lname { font-size: 15px; font-weight: 700; fill: #6b7280; letter-spacing: 1.5px; }
  .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.8; }
  .key { fill: #eef2ff; stroke: #1428a0; stroke-width: 2.4; }
  .soft { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .exit { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.6; }
  .t { font-size: 19px; font-weight: 600; fill: #111827; }
  .s { font-size: 14.5px; fill: #4b5563; }
  .n { font-size: 13px; font-weight: 700; fill: #1428a0; }
  .lbl { font-size: 14px; fill: #374151; }
  .blue { fill: #1428a0; font-weight: 600; }
  .arrow { stroke: #1f2937; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  .accent { stroke: #1428a0; stroke-width: 2.4; fill: none; marker-end: url(#b); }
  .dash { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
</style>
</head>
<body>
<svg width="1600" height="780" viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1428a0"/></marker>
  </defs>

  <!-- layer bands -->
  <rect class="layer" x="20" y="16" width="1560" height="118" rx="12"/>
  <rect class="layer" x="20" y="150" width="1560" height="92" rx="12"/>
  <rect class="layer" x="20" y="258" width="1560" height="310" rx="12"/>
  <rect class="layer" x="20" y="584" width="1560" height="116" rx="12"/>
  <text class="lname" x="40" y="80">CLIENTS</text>
  <text class="lname" x="40" y="202">API</text>
  <text class="lname" x="40" y="420">ENGINE</text>
  <text class="lname" x="40" y="648">DATA</text>

  <!-- clients -->
  <rect class="box" x="180" y="32" width="380" height="86" rx="10"/>
  <text class="t" x="200" y="66">Web console (Next.js)</text>
  <text class="s" x="200" y="94">plan · trace · JSON · batch · metrics</text>

  <rect class="box" x="590" y="32" width="380" height="86" rx="10"/>
  <text class="t" x="610" y="66">Batch + eval runner</text>
  <text class="s" x="610" y="94">results.jsonl · metrics.md (own scorer)</text>

  <rect class="key" x="1000" y="32" width="560" height="86" rx="10"/>
  <text class="t" x="1020" y="64">Closed loop on the phone (our add-on)</text>
  <text class="s" x="1020" y="92">tap act/ link → read val/ link → compare → only then unlock</text>
  <text class="s" x="1020" y="110">restart / safe mode / reset · simulated phone in the console</text>

  <!-- api -->
  <rect class="box" x="180" y="166" width="1380" height="60" rx="10"/>
  <text class="t" x="200" y="203">FastAPI</text>
  <text class="s" x="290" y="203">POST /v1/troubleshoot   ·   GET /health   ·   /v1/sim/start · /v1/sim/tap · /v1/verify   ·   /v1/batch · /v1/metrics</text>

  <path class="arrow" d="M 370 118 L 370 164"/>
  <path class="arrow" d="M 780 118 L 780 164"/>
  <path class="accent" d="M 1280 118 L 1280 164"/>

  <!-- engine chain -->
  <rect class="box" x="180" y="330" width="190" height="112" rx="10"/>
  <text class="n" x="194" y="352">0</text>
  <text class="t" x="275" y="372" text-anchor="middle">Enrichment</text>
  <text class="s" x="275" y="398" text-anchor="middle">symptoms, device,</text>
  <text class="s" x="275" y="418" text-anchor="middle">intents, paraphrases</text>

  <rect class="box" x="410" y="330" width="190" height="112" rx="10"/>
  <text class="n" x="424" y="352">3</text>
  <text class="t" x="505" y="372" text-anchor="middle">Semantic cache</text>
  <text class="s" x="505" y="398" text-anchor="middle">nearest kit question,</text>
  <text class="s" x="505" y="418" text-anchor="middle">char n-gram cosine</text>

  <rect class="box" x="640" y="330" width="190" height="112" rx="10"/>
  <text class="n" x="654" y="352">1</text>
  <text class="t" x="735" y="372" text-anchor="middle">SIIS lookup</text>
  <text class="s" x="735" y="398" text-anchor="middle">TF-IDF over articles</text>
  <text class="s" x="735" y="418" text-anchor="middle">+ relevance gate</text>

  <rect class="box" x="870" y="330" width="190" height="112" rx="10"/>
  <text class="n" x="884" y="352">1</text>
  <text class="t" x="965" y="372" text-anchor="middle">Extraction</text>
  <text class="s" x="965" y="398" text-anchor="middle">atomic steps, 1 screen</text>
  <text class="s" x="965" y="418" text-anchor="middle">per action, source spans</text>

  <rect class="box" x="1100" y="330" width="190" height="112" rx="10"/>
  <text class="n" x="1114" y="352">2</text>
  <text class="t" x="1195" y="372" text-anchor="middle">Deeplink map</text>
  <text class="s" x="1195" y="398" text-anchor="middle">setting name first,</text>
  <text class="s" x="1195" y="418" text-anchor="middle">on/off twin picked</text>

  <rect class="key" x="1330" y="330" width="230" height="112" rx="10"/>
  <text class="n" x="1344" y="352">4</text>
  <text class="t" x="1445" y="372" text-anchor="middle">Validate</text>
  <text class="s" x="1445" y="398" text-anchor="middle">rules, no URLs, catalog</text>
  <text class="s" x="1445" y="418" text-anchor="middle">only, auto → manual → critical</text>

  <path class="arrow" d="M 275 226 L 275 328"/>
  <text class="lbl" x="285" y="300">complaint (+ SIIS)</text>
  <path class="arrow" d="M 370 386 L 408 386"/>
  <path class="arrow" d="M 600 386 L 638 386"/>
  <text class="lbl" x="619" y="376" text-anchor="middle">miss</text>
  <path class="arrow" d="M 830 386 L 868 386"/>
  <path class="arrow" d="M 1060 386 L 1098 386"/>
  <path class="arrow" d="M 1290 386 L 1328 386"/>
  <path class="arrow" d="M 1445 330 L 1445 228"/>
  <text class="lbl" x="1455" y="290">plan JSON</text>

  <!-- cache hit shortcut -->
  <path class="accent" d="M 505 330 C 505 290, 1180 290, 1330 340"/>
  <text class="lbl blue" x="840" y="279" text-anchor="middle">cache hit: plan back in ~2 ms, $0</text>

  <!-- exits / optional -->
  <path class="arrow" d="M 790 442 L 790 478"/>
  <rect class="exit" x="700" y="480" width="200" height="66" rx="10"/>
  <text class="t" x="800" y="507" text-anchor="middle" style="font-size:16px">Empty plan</text>
  <text class="s" x="800" y="530" text-anchor="middle" style="font-size:13px">no fitting article, no guessing</text>

  <rect class="soft" x="930" y="480" width="330" height="66" rx="10"/>
  <text class="t" x="950" y="507" style="font-size:16px">Groq · gpt-oss-120b (optional)</text>
  <text class="s" x="950" y="530" style="font-size:13px">drafts steps + paraphrases, re-checked</text>
  <path class="dash" d="M 1000 478 L 1000 444"/>

  <!-- data -->
  <rect class="box" x="410" y="604" width="190" height="78" rx="10"/>
  <text class="t" x="505" y="636" text-anchor="middle" style="font-size:16px">Cache store</text>
  <text class="s" x="505" y="660" text-anchor="middle">in memory, pre-warmed</text>
  <path class="dash" d="M 505 602 L 505 444"/>

  <rect class="box" x="610" y="604" width="220" height="78" rx="10"/>
  <text class="t" x="720" y="636" text-anchor="middle" style="font-size:16px">20 SIIS articles</text>
  <text class="s" x="720" y="660" text-anchor="middle">kit knowledge base</text>
  <path class="dash" d="M 680 602 L 680 444"/>

  <rect class="box" x="1100" y="604" width="190" height="78" rx="10"/>
  <text class="t" x="1195" y="636" text-anchor="middle" style="font-size:16px">578 deeplinks</text>
  <text class="s" x="1195" y="660" text-anchor="middle">act/ + val/ catalog</text>
  <path class="dash" d="M 1230 602 L 1230 444"/>

  <rect class="soft" x="1330" y="604" width="230" height="78" rx="10"/>
  <text class="t" x="1445" y="636" text-anchor="middle" style="font-size:16px">Eval set</text>
  <text class="s" x="1445" y="660" text-anchor="middle">gold labels · 60 paraphrases</text>

  <text class="s" x="180" y="735">Stage numbers follow the Theme 2 brief.  Cold request: ~30 ms offline, ~4-5 s with the LLM on.  Dashed = optional / offline data.</text>
</svg>
</body>
</html>
